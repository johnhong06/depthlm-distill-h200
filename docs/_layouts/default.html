<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">Aerodrone H200 <span>사용법</span></a>
  <nav>
    <a href="#flow">전체 흐름</a>
    <a href="#request">요청서</a>
    <a href="#progress">진행 과정</a>
    <a href="#paths">경로</a>
    <a href="#data">데이터 전달</a>
    <a href="#rules">지킬 것</a>
    <a href="#results">결과 받기</a>
    <a href="#issues">문제와 해결</a>
    <a href="#example">사용 예</a>
  </nav>
  <a class="repo-link" href="https://github.com/{{ site.repository }}"
     target="_blank" rel="noopener"><svg class="gh" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg> GitHub 저장소</a>
</header>
<main>
  <h1>{{ page.title }}</h1>
  {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  {{ content }}
</main>
<footer class="site">
  항공드론혁신융합대학 Aerodrone-H200 GPU 서버 · 2026년 9월 사용 기준
  <br>
  <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">github.com/{{ site.repository }}</a>
</footer>
<script>
// 마크다운 표를 가로 스크롤 컨테이너로 감싼다 (좁은 화면에서 페이지가 밀리지 않게).
document.querySelectorAll('main table').forEach(t => {
  const w = document.createElement('div');
  w.className = 'table-wrap';
  t.parentNode.insertBefore(w, t);
  w.appendChild(t);
});
</script>
</body>
</html>
